# extlinux.conf for AI3399-C mainline 6.18 kernel
# Minimal config for vendor U-Boot distro_bootcmd compatibility.

LABEL linux
    LINUX /Image
    INITRD /gadget-initramfs.cpio.gz
    FDT /rk3399-ai3399-c.dtb
    APPEND root=PARTLABEL=rootfs rootwait rw rootfstype=ext4 console=ttyS0,115200n8 console=tty1
