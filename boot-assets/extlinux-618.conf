# extlinux.conf for AI3399-C mainline 6.18 kernel
# Booted by the vendor U-Boot's distro_bootcmd (bootcmd fallback path).
# INITRD is the gadget debug initramfs: USB serial (ttyGS0) console + rootfs
# scan by PARTNAME, so boot failures stay diagnosable over the OTG port.

LABEL Armbian 6.18 mainline
    LINUX /Image
    INITRD /gadget-initramfs.cpio.gz
    FDT /rk3399-ai3399-c.dtb
    APPEND root=PARTLABEL=rootfs rootwait rw rootfstype=ext4 console=ttyS0,115200n8 console=tty1 earlycon=uart8250,mmio32,0xff180000
    FDTOVERLAYS /
