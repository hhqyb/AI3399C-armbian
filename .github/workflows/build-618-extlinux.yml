#==========================================================================
# Description: Build a VFAT boot partition image with extlinux for the
#              mainline 6.18 kernel.  Written to the eMMC "recovery"
#              partition; the vendor U-Boot's distro_bootcmd boots it when
#              boot_android fails fast (boot partition magic cleared).
#==========================================================================
name: Build 6.18 extlinux boot image

on:
  workflow_dispatch:

env:
  TZ: Etc/UTC
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download mainline assets
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/src"
          cd "${{ github.workspace }}/src"
          gh release download mainline-assets \
            -p 'kernel-6.18-Image' -p 'rk3399-ai3399-c.dtb'
          cp "${{ github.workspace }}/boot-assets/gadget-initramfs.cpio.gz" .
          cp "${{ github.workspace }}/boot-assets/extlinux-618.conf" extlinux.conf
          ls -lh

      - name: Install mtools
        run: sudo apt-get install -y mtools dosfstools

      - name: Assemble VFAT image
        run: |
          set -e
          work="${{ github.workspace }}/src"
          img="${{ github.workspace }}/recovery-618.vfat"
          # 40 MiB image; fits the 44 MiB "boot" partition
          dd if=/dev/zero of="$img" bs=1M count=40
          mkfs.vfat -F 32 "$img" >/dev/null
          sudo mkdir -p /mnt/vfat
          sudo mount -o loop "$img" /mnt/vfat
          sudo mkdir -p /mnt/vfat/extlinux
          sudo cp "$work/kernel-6.18-Image" /mnt/vfat/Image
          sudo cp "$work/gadget-initramfs.cpio.gz" /mnt/vfat/gadget-initramfs.cpio.gz
          sudo cp "$work/rk3399-ai3399-c.dtb" /mnt/vfat/rk3399-ai3399-c.dtb
          sudo cp "$work/extlinux.conf" /mnt/vfat/extlinux/extlinux.conf
          sudo df -h /mnt/vfat
          sudo ls -lhR /mnt/vfat
          sudo umount /mnt/vfat
          ls -lh "$img"
          echo "image built at $img"

      - name: Upload image
        uses: ophub/upload-to-releases@main
        with:
          tag: mainline-assets
          artifacts: ${{ github.workspace }}/recovery-618.vfat
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Mainline 6.18 extlinux boot image (VFAT 16MB)
            Written to the eMMC "boot" partition; booted by the vendor
            U-Boot distro_bootcmd when boot_android fails fast.
